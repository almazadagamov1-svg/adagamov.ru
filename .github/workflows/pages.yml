name: Publish adagamov.ru

on:
  push:
    branches: [main]
    paths:
      - 'release/pages-release.part-*'
      - 'release/pages-release.sha256'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: adagamov-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack release
        shell: bash
        run: |
          set -euo pipefail
          cat release/pages-release.part-* > /tmp/pages-release.tar.gz
          printf '%s  %s\n' "$(cat release/pages-release.sha256)" /tmp/pages-release.tar.gz | sha256sum -c -
          mkdir -p _site
          tar -xzf /tmp/pages-release.tar.gz -C _site --no-same-owner
          test -s _site/index.html
          test -s _site/karta-gvr/index.html
          test -s _site/data/gvr/map/manifest.json
          test -s _site/data/torgi/map/manifest.json
          test ! -e _site/data/torgi/source
          test ! -e _site/data/torgi/evidence
          test ! -e _site/data/torgi/card-evidence
          test ! -e _site/data/torgi/regions
          ! rg -l 'chatgpt.site|signin-with-chatgpt' _site --glob '*.html' --glob '*.js'
          printf '%s\n' adagamov.ru > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for this attempt's Pages artifact
        uses: actions/github-script@v8
        timeout-minutes: 2
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const matches = data.artifacts.filter(a => a.name === name && !a.expired);
              core.info(`Artifact readiness ${attempt}/12: ${matches.length} matching artifact(s)`);
              if (matches.length === 1) return;
              if (matches.length > 1) throw new Error("Ambiguous Pages artifact for this attempt");
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error("Pages artifact did not become visible within the bounded wait");
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
