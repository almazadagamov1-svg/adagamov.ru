name: Publish adagamov.ru

on:
  push:
    branches: [main]
    paths:
      - 'release/pages-release.part-*'
      - 'release/pages-release.sha256'
      - '.github/workflows/pages.yml'
      - 'trials/kazan-geometry/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: adagamov-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack release
        shell: bash
        run: |
          set -euo pipefail
          cat release/pages-release.part-* > /tmp/pages-release.tar.gz
          printf '%s  %s\n' "$(cat release/pages-release.sha256)" /tmp/pages-release.tar.gz | sha256sum -c -
          mkdir -p _site
          tar -xzf /tmp/pages-release.tar.gz -C _site --no-same-owner
          test -s _site/index.html
          test -s _site/karta-gvr/index.html
          test -s _site/data/gvr/map/manifest.json
          test -s _site/data/torgi/map/manifest.json
          test ! -e _site/data/torgi/source
          test ! -e _site/data/torgi/evidence
          test ! -e _site/data/torgi/card-evidence
          test ! -e _site/data/torgi/regions
          ! rg -l 'chatgpt.site|signin-with-chatgpt' _site --glob '*.html' --glob '*.js'
          printf '%s\n' adagamov.ru > _site/CNAME
          touch _site/.nojekyll
      - name: Verify and add bounded Kazan geometry trial
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('trials/kazan-geometry')
          manifest=json.loads((root/'manifest.json').read_text())
          body=(root/'index.html').read_bytes()
          assert hashlib.sha256(body).hexdigest()==manifest['htmlSha256'], 'Trial HTML checksum mismatch'
          text=body.decode()
          match=re.search(r'<script id="trial-data" type="application/json">(.*?)</script>',text,re.S)
          assert match, 'Trial payload missing'
          assert hashlib.sha256(match.group(1).encode()).hexdigest()==manifest['dataSha256'], 'Trial data checksum mismatch'
          data=json.loads(match.group(1))
          assert data['trialId']==manifest['trialId']
          assert data['sourceDate']==manifest['sourceDate']=='2026-10-22'
          assert data['spatialClaim'] is False
          assert data['counts']==manifest['counts']=={'source_ring':5,'source_gap':1,'open_sequence':1,'points_only':4}
          assert len(data['records'])==manifest['records']==11
          west,south,east,north=data['bounds']
          for record in data['records']:
              assert record['spatialClaim'] is False and record['sourceGeometryChanged'] is False
              assert all(west<=p[0]<=east and south<=p[1]<=north for p in record['points'])
          forbidden={'holder','inn','sourcePayloadHash','sourceRow','originalRawCoordinates','place_raw','h','i','l'}
          def inspect(value):
              if isinstance(value,dict):
                  assert not forbidden.intersection(value), 'Private source field in trial'
                  for item in value.values():inspect(item)
              elif isinstance(value,list):
                  for item in value:inspect(item)
          inspect(data)
          assert 'chatgpt.site' not in text and 'signin-with-chatgpt' not in text
          print('Verified Kazan trial',manifest['trialId'])
          PY
          mkdir -p _site/karta-gvr/kazan-trial
          cp trials/kazan-geometry/index.html _site/karta-gvr/kazan-trial/index.html
          cp trials/kazan-geometry/manifest.json _site/karta-gvr/kazan-trial/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for this attempt's Pages artifact
        uses: actions/github-script@v8
        timeout-minutes: 2
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 1; attempt <= 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const matches = data.artifacts.filter(a => a.name === name && !a.expired);
              core.info(`Artifact readiness ${attempt}/12: ${matches.length} matching artifact(s)`);
              if (matches.length === 1) return;
              if (matches.length > 1) throw new Error("Ambiguous Pages artifact for this attempt");
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error("Pages artifact did not become visible within the bounded wait");
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
